# =====================================================
# UniLost - application.properties
# =====================================================

# ---- Server ----
server.port=${PORT:8080}

# ---- MySQL Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/unilost_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:#Amrut@77}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ---- File Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
unilost.upload.dir=${UPLOAD_DIR:uploads}

# ---- Email / SMTP ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:amrutsonar177@gmail.com}
spring.mail.password=${MAIL_PASSWORD:#Amrut@177}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- UniLost Email ----
unilost.mail.from=${MAIL_FROM:UniLost <amrut5376@gmail.com>}

# ---- OTP ----
unilost.otp.expiry-minutes=10
unilost.otp.resend-cooldown-seconds=60
