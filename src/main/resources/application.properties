# =====================================================
# UniLost - application.properties
# =====================================================

# ---- Server ----
server.port=8080

# ---- MySQL Database connection ----
spring.datasource.url=jdbc:mysql://localhost:3306/unilost_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=#Amrut@77
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ---- File Upload settings ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Folder where uploaded item images are stored
unilost.upload.dir=uploads

# ---- Email / SMTP (for OTP delivery) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=amrut5376@gmail.com
spring.mail.password=YOUR_16_CHAR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Display name that appears in the "From" field of OTP emails
unilost.mail.from=UniLost <amrut5376@gmail.com>

# OTP settings
# How long (minutes) before an OTP expires
unilost.otp.expiry-minutes=10
# Minimum seconds between consecutive OTP sends for the same email (rate-limit)
unilost.otp.resend-cooldown-seconds=60
