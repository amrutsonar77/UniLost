<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(ellipse 55% 45% at 20% 10%, rgba(167,139,250,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 15%, rgba(56,189,248,0.18)  0%, transparent 60%),
        radial-gradient(ellipse 45% 40% at 50% 90%, rgba(251,191,36,0.14)  0%, transparent 60%);
      pointer-events:none;
    }
    .al-card {
      background:rgba(255,255,255,0.92); border:1px solid rgba(17,20,57,0.10);
      border-radius:var(--r-2xl); padding:48px 44px;
      width:100%; max-width:420px; position:relative; z-index:2;
      box-shadow:0 8px 40px rgba(17,20,57,0.12), 0 2px 8px rgba(17,20,57,0.06);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      overflow:hidden;
    }
    .al-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(135deg,#a78bfa,#38bdf8,#fbbf24); pointer-events:none; }
    .restricted-tag { display:inline-flex; align-items:center; gap:6px; background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.2); color:#dc2626; font-size:.7rem; font-weight:700; padding:4px 12px; border-radius:99px; text-transform:uppercase; letter-spacing:.8px; }
  </style>
</head>
<body>
  <div class="al-card">
    <div style="text-align:center;margin-bottom:32px;position:relative;z-index:1;">
      <div class="restricted-tag" style="margin-bottom:16px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Restricted Access
      </div>
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#a78bfa,#38bdf8);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 4px 16px rgba(167,139,250,0.35);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
      <h2 style="font-size:1.4rem;font-weight:900;letter-spacing:-.5px;margin:0 0 6px;color:var(--text);">Admin Portal</h2>
      <p style="color:var(--text-4);font-size:.82rem;margin:0;">Authorized personnel only</p>
    </div>

    <div id="adminLoginAlert" class="d-none" style="background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:#dc2626;border-radius:var(--r-sm);padding:11px 14px;font-size:.83rem;margin-bottom:20px;position:relative;z-index:1;align-items:center;gap:8px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span id="adminLoginMsg"></span>
    </div>

    <form id="adminLoginForm" novalidate style="position:relative;z-index:1;">
      <div class="mb-3">
        <label style="font-size:.78rem;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;">Admin Email</label>
        <div style="position:relative;">
          <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);display:flex;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" class="form-control" id="adminEmail" required
                 placeholder="admin@unilost.com" style="padding-left:40px !important;" autocomplete="email">
        </div>
      </div>
      <div class="mb-5">
        <label style="font-size:.78rem;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;">Password</label>
        <div style="position:relative;">
          <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);display:flex;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" class="form-control" id="adminPassword" required
                 placeholder="••••••••" style="padding-left:40px !important;" autocomplete="current-password">
        </div>
      </div>
      <button type="submit" id="adminLoginBtn" class="btn-auth">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Access Dashboard
      </button>
    </form>

    <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);position:relative;z-index:1;">
      <a href="login.html?admin=1" style="color:var(--text-3);font-size:.78rem;display:inline-flex;align-items:center;gap:5px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to login
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email=document.getElementById("adminEmail").value.trim();
      const password=document.getElementById("adminPassword").value;
      const alertBox=document.getElementById("adminLoginAlert");
      const alertMsg=document.getElementById("adminLoginMsg");
      const btn=document.getElementById("adminLoginBtn");
      alertBox.classList.add("d-none"); alertBox.style.display=""; btn.disabled=true;
      btn.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-4.43"/></svg> Verifying…`;
      try {
        const res=await fetch(`${API_BASE}/auth/admin-login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
        const data=await res.json();
        if(data.success && data.role==="ADMIN"){saveLoggedInUser(data);window.location.href="admin.html";}
        else{alertMsg.textContent=data.message||"Access denied.";alertBox.classList.remove("d-none");alertBox.style.display="flex";}
      } catch{alertMsg.textContent="Could not connect to server.";alertBox.classList.remove("d-none");alertBox.style.display="flex";}
      finally{btn.disabled=false;btn.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Access Dashboard`;}
    });
  </script>
</body></html>
