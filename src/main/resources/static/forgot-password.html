<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-blob auth-blob-1" aria-hidden="true"></div>
  <div class="auth-blob auth-blob-2" aria-hidden="true"></div>
  <div class="auth-blob auth-blob-3" aria-hidden="true"></div>

  <div class="auth-wrap">
    <div class="auth-card" role="main">

      <!-- Logo -->
      <div style="text-align:center;margin-bottom:22px;">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:16px;">
          <span class="brand-mark">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
              <circle cx="8.5" cy="8.5" r="5.5" stroke="#fff" stroke-width="2"/>
              <circle cx="8.5" cy="7.5" r="1.6" fill="#fff"/>
              <path d="M8.5 9.1C7.2 10.8 8.5 12.5 8.5 12.5C8.5 12.5 9.8 10.8 8.5 9.1Z" fill="#fff"/>
              <line x1="13" y1="13" x2="18.5" y2="18.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span style="font-weight:800;font-size:1rem;color:var(--text);">UniLost</span>
        </a>
        <h1 style="font-size:1.4rem;font-weight:900;letter-spacing:-.5px;margin:0 0 5px;color:var(--text);">Reset Password</h1>
        <p style="color:var(--text-3);font-size:.85rem;margin:0;">Enter your email to get started</p>
      </div>

      <!-- Step indicator: 2 steps -->
      <div class="step-indicator" id="fpStepIndicator" aria-label="Reset progress">
        <div class="step-dot active" id="fpDot1"></div>
        <div class="step-line"       id="fpLine1"></div>
        <div class="step-dot"        id="fpDot2"></div>
      </div>

      <!-- Alert box -->
      <div class="auth-alert" id="fpAlert" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span id="fpAlertMsg"></span>
      </div>

      <!-- ── STEP 1: Enter email ─────────────────────── -->
      <div class="step-panel active" id="fpStep1">
        <form id="fpStep1Form" novalidate>
          <div class="mb-4">
            <label class="form-label" for="fpEmail">Registered Email <span style="color:var(--danger)">*</span></label>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
              <input type="email" class="form-control" id="fpEmail"
                     required placeholder="you@example.com" autocomplete="email">
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>
          </div>
          <button type="submit" class="btn-auth" id="fpSendOtpBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            Continue
          </button>
        </form>

        <div style="text-align:center;margin-top:16px;">
          <a href="login.html" class="back-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to sign in
          </a>
        </div>
      </div>

      <!-- ── STEP 2: Set new password ───────────────── -->
      <div class="step-panel" id="fpStep2">
        <form id="fpStep2Form" novalidate>

          <div class="mb-3">
            <label class="form-label" for="fpNewPwd">New Password <span style="color:var(--danger)">*</span></label>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-control" id="fpNewPwd"
                     required minlength="6" maxlength="128"
                     placeholder="Min. 6 characters" autocomplete="new-password"
                     style="padding-right:42px !important;">
              <button type="button" class="toggle-pwd" onclick="togglePwd('fpNewPwd',this)" aria-label="Toggle">
                <svg class="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <div class="invalid-feedback">Min. 6 characters.</div>
            </div>
            <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="fpPwdFill"></div></div>
            <div class="pwd-strength-label" id="fpPwdLabel" style="color:var(--text-4);"></div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="fpConfirmPwd">Confirm Password <span style="color:var(--danger)">*</span></label>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-control" id="fpConfirmPwd"
                     required minlength="6" maxlength="128"
                     placeholder="Re-enter new password" autocomplete="new-password"
                     style="padding-right:42px !important;">
              <button type="button" class="toggle-pwd" onclick="togglePwd('fpConfirmPwd',this)" aria-label="Toggle">
                <svg class="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <div class="invalid-feedback" id="fpConfirmFeedback">Passwords do not match.</div>
            </div>
          </div>

          <button type="submit" class="btn-auth" id="fpResetBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Set New Password
          </button>
        </form>

        <div style="text-align:center;margin-top:14px;">
          <button class="back-link" onclick="fpGoToStep1()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Change email
          </button>
        </div>
      </div>

      <!-- ── STEP 3: Success ────────────────────────── -->
      <div class="step-panel" id="fpStep3">
        <div style="text-align:center;padding:16px 0;">
          <div class="success-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 style="font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:8px;">Password Reset!</h2>
          <p style="color:var(--text-3);font-size:.875rem;margin-bottom:24px;">Your password has been updated. You can now sign in with your new password.</p>
          <a href="login.html" class="btn-auth" style="text-decoration:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In Now
          </a>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
