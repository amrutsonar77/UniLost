<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Found Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbarPlaceholder"></div>
  <script>window.ACTIVE_NAV="found";</script>

  <div class="page-hero hero-illustrated">
    <div class="container">
      <div class="hi-inner">
        <div class="hi-copy">
          <span class="section-label">Found Items Registry</span>
          <h1>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Found Items
          </h1>
          <p>Items found on campus waiting to be reunited with their owner.</p>
          <div class="hi-actions">
            <a href="report-found.html" class="btn-uni-primary px-4 py-2">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Report Found Item
            </a>
          </div>
        </div>
        <div class="hi-visual">
          <!-- Found Items illustration — student holding a found box -->
          <svg viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;">
            <!-- bg blob -->
            <ellipse cx="180" cy="130" rx="105" ry="88" fill="rgba(5,150,105,0.07)"/>
            <!-- checkmark badge -->
            <circle cx="220" cy="60" r="28" fill="#D1FAE5"/>
            <circle cx="220" cy="60" r="22" fill="#059669"/>
            <polyline points="209,60 218,70 232,50" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- box / package -->
            <rect x="80" y="128" width="88" height="72" rx="8" fill="#D97706"/>
            <rect x="80" y="128" width="88" height="24" rx="8" fill="#F59E0B"/>
            <rect x="118" y="128" width="12" height="72" fill="#B45309"/>
            <rect x="80" y="138" width="88" height="4" fill="#B45309" opacity=".4"/>
            <!-- person -->
            <ellipse cx="120" cy="205" rx="38" ry="14" fill="rgba(5,150,105,0.10)"/>
            <rect x="94" y="130" width="52" height="68" rx="26" fill="#059669"/>
            <rect x="98" y="130" width="44" height="32" rx="22" fill="#10B981"/>
            <!-- arms holding box -->
            <path d="M94 158 Q68 162 68 178" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
            <path d="M146 158 Q172 162 172 178" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
            <!-- head -->
            <circle cx="120" cy="108" r="28" fill="#FBBF24"/>
            <circle cx="110" cy="104" r="4" fill="#1F2937"/>
            <circle cx="130" cy="104" r="4" fill="#1F2937"/>
            <path d="M112 120 Q120 128 128 120" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <!-- hair -->
            <path d="M92 98 Q94 78 120 76 Q146 78 148 98" fill="#1F2937"/>
            <!-- floating items -->
            <rect x="185" y="140" width="42" height="32" rx="6" fill="#2563EB" opacity=".8"/>
            <rect x="185" y="140" width="42" height="10" rx="6" fill="#3B82F6" opacity=".8"/>
            <!-- sparkles -->
            <text x="48" y="85" font-size="16" fill="#6EE7B7" opacity=".8">✦</text>
            <text x="225" y="105" font-size="12" fill="#34D399" opacity=".9">✦</text>
            <text x="200" y="185" font-size="10" fill="#059669" opacity=".6">✦</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="container page-wrapper" style="padding-top:28px;">
    <div class="filter-bar">
      <div class="row g-3 align-items-end">
        <div class="col-lg-4 col-12">
          <label class="form-label">Search</label>
          <div class="search-bar">
            <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Item name, keyword…" onkeydown="if(event.key==='Enter')searchFoundItems()">
          </div>
        </div>
        <div class="col-lg-2 col-6"><label class="form-label">Category</label><select id="categoryFilter" class="form-select"></select></div>
        <div class="col-lg-2 col-6">
          <label class="form-label">Status</label>
          <select id="statusFilter" class="form-select">
            <option value="">All Statuses</option>
            <option value="PENDING">Pending</option><option value="MATCHED">Matched</option><option value="RECOVERED">Recovered</option>
          </select>
        </div>
        <div class="col-lg-2 col-6"><label class="form-label">Color</label><input type="text" id="colorFilter" class="form-control" placeholder="e.g. Black"></div>
        <div class="col-lg-2 col-6"><label class="form-label">Location</label><input type="text" id="locationFilter" class="form-control" placeholder="e.g. Canteen"></div>
      </div>
      <div class="d-flex gap-2 mt-3 align-items-center flex-wrap">
        <button class="btn-uni-primary btn btn-sm px-4" onclick="searchFoundItems()">Search</button>
        <button onclick="resetFoundFilters()" class="btn-ghost btn btn-sm px-4">Reset</button>
        <span id="resultsInfo" style="font-size:.8rem;color:var(--text-4);margin-left:auto;"></span>
      </div>
    </div>
    <div id="foundItemsContainer" class="row g-4"></div>
  </div>

  <footer>UniLost &copy; 2026 &nbsp;·&nbsp; Campus Lost &amp; Found</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script><script src="js/found-list.js"></script>
</body></html>
