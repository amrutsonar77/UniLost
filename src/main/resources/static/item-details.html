<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Item Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbarPlaceholder"></div>
  <script>window.ACTIVE_NAV="";</script>
  <div class="container page-wrapper" id="detailsRoot">
    <div class="state-container" style="min-height:60vh;">
      <div class="spinner-uni"></div>
      <p style="color:var(--text-4);font-size:.85rem;margin-top:8px;">Loading item…</p>
    </div>
  </div>

  <!-- Claim Modal -->
  <div class="modal fade" id="claimModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--r-xl);">
        <div class="modal-header" style="border-bottom:1px solid var(--border);padding:18px 24px;">
          <h5 class="modal-title" style="font-weight:800;font-size:.95rem;color:var(--text);display:flex;align-items:center;gap:8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Claim This Item
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px 24px;">
          <div id="claimAlert" class="alert d-none" style="border-radius:var(--r-sm);font-size:.85rem;"></div>
          <p style="color:var(--text-3);font-size:.83rem;margin-bottom:18px;">Convince the finder this item belongs to you. Be specific and honest.</p>
          <form id="claimForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Why is this your item? <span style="color:var(--danger)">*</span></label>
              <textarea class="form-control" id="claimReason" rows="2" maxlength="500" required placeholder="Describe when, where and how you lost it…"></textarea>
              <div class="invalid-feedback">Required.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Unique identifying detail <span style="color:var(--danger)">*</span></label>
              <textarea class="form-control" id="claimDetail" rows="2" maxlength="500" required placeholder="Sticker, scratch, serial number, contents…"></textarea>
              <div class="invalid-feedback">Required.</div>
            </div>
            <div class="mb-4">
              <label class="form-label">Where did you lose it? <span style="color:var(--danger)">*</span></label>
              <input type="text" class="form-control" id="claimLocation" required placeholder="e.g. Library, 2nd floor">
              <div class="invalid-feedback">Required.</div>
            </div>
            <button type="submit" class="btn-uni-primary btn w-100 py-2" style="justify-content:center;">Submit Claim Request</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer>UniLost &copy; 2026 &nbsp;·&nbsp; Campus Lost &amp; Found</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script><script src="js/item-details.js"></script>
</body></html>
