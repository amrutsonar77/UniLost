<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    /* Tab switcher */
    .login-tabs {
      display: flex;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 4px;
      margin-bottom: 26px;
      gap: 4px;
    }
    .login-tab {
      flex: 1;
      background: none;
      border: none;
      border-radius: 9999px;
      padding: 8px 0;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      font-family: var(--font);
      transition: all .18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .login-tab.active {
      background: var(--text);
      color: #fff;
      box-shadow: 0 2px 8px rgba(17,20,57,0.22);
    }

    /* Panel visibility */
    .login-panel { display: none; }
    .login-panel.active {
      display: block;
      animation: stepIn .28s cubic-bezier(.34,1.56,.64,1) both;
    }

    /* Admin panel accent */
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(220,38,38,.07);
      border: 1px solid rgba(220,38,38,.18);
      color: #dc2626;
      font-size: .68rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- Animated blobs -->
  <div class="auth-blob auth-blob-1" aria-hidden="true"></div>
  <div class="auth-blob auth-blob-2" aria-hidden="true"></div>
  <div class="auth-blob auth-blob-3" aria-hidden="true"></div>

  <div class="auth-wrap">
    <div class="auth-card" role="main">

      <!-- Logo -->
      <div style="text-align:center;margin-bottom:22px;">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:16px;">
          <span class="brand-mark">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
              <circle cx="8.5" cy="8.5" r="5.5" stroke="#fff" stroke-width="2"/>
              <circle cx="8.5" cy="7.5" r="1.6" fill="#fff"/>
              <path d="M8.5 9.1C7.2 10.8 8.5 12.5 8.5 12.5C8.5 12.5 9.8 10.8 8.5 9.1Z" fill="#fff"/>
              <line x1="13" y1="13" x2="18.5" y2="18.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span style="font-weight:800;font-size:1rem;color:var(--text);">UniLost</span>
        </a>
        <h1 style="font-size:1.4rem;font-weight:900;letter-spacing:-.5px;margin:0 0 4px;color:var(--text);">Welcome back</h1>
        <p style="color:var(--text-3);font-size:.85rem;margin:0;">Sign in to your account</p>
      </div>

      <!-- Tab switcher -->
      <div class="login-tabs" role="tablist">
        <button class="login-tab active" id="tabStudent" role="tab"
                aria-selected="true" onclick="switchLoginTab('student')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Student
        </button>
        <button class="login-tab" id="tabAdmin" role="tab"
                aria-selected="false" onclick="switchLoginTab('admin')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Admin
        </button>
      </div>

      <!-- ── STUDENT LOGIN ─────────────────────────────── -->
      <div class="login-panel active" id="panelStudent">

        <div class="auth-alert" id="loginAlert" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span id="loginAlertMsg"></span>
        </div>

        <form id="loginForm" novalidate autocomplete="on" onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label class="form-label" for="email">Email address <span style="color:var(--danger)">*</span></label>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
              <input type="email" class="form-control" id="email" name="email"
                     required placeholder="you@example.com" autocomplete="email">
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="mb-4">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <label class="form-label" for="password" style="margin-bottom:0;">Password <span style="color:var(--danger)">*</span></label>
              <a href="forgot-password.html" style="font-size:.78rem;color:#7c3aed;font-weight:600;">Forgot password?</a>
            </div>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-control" id="password" name="password"
                     required placeholder="Your password" autocomplete="current-password"
                     style="padding-right:42px !important;">
              <button type="button" class="toggle-pwd" onclick="togglePwd('password',this)" aria-label="Toggle password visibility">
                <svg class="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>

          <button type="submit" class="btn-auth" id="loginBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In
          </button>
        </form>

        <p style="text-align:center;margin-top:20px;font-size:.83rem;color:var(--text-3);">
          Don't have an account?
          <a href="register.html" style="color:#7c3aed;font-weight:600;">Create one free</a>
        </p>
      </div>

      <!-- ── ADMIN LOGIN ───────────────────────────────── -->
      <div class="login-panel" id="panelAdmin">

        <div style="text-align:center;margin-bottom:20px;">
          <div class="admin-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Restricted Access
          </div>
          <p style="color:var(--text-3);font-size:.82rem;margin:0;">Authorized personnel only</p>
        </div>

        <div class="auth-alert" id="adminLoginAlert" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span id="adminLoginMsg"></span>
        </div>

        <form id="adminLoginForm" novalidate autocomplete="off" onsubmit="handleAdminLogin(event)">
          <div class="mb-3">
            <label class="form-label" for="adminEmail">Admin Email <span style="color:var(--danger)">*</span></label>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
              <input type="email" class="form-control" id="adminEmail" name="adminEmail"
                     required placeholder="admin@example.com" autocomplete="email">
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="adminPassword">Password <span style="color:var(--danger)">*</span></label>
            <div class="input-icon-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-control" id="adminPassword" name="adminPassword"
                     required placeholder="Admin password" autocomplete="current-password"
                     style="padding-right:42px !important;">
              <button type="button" class="toggle-pwd" onclick="togglePwd('adminPassword',this)" aria-label="Toggle password visibility">
                <svg class="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>

          <button type="submit" class="btn-auth" id="adminLoginBtn" style="background:linear-gradient(135deg,#7c1d1d,#991b1b);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Access Dashboard
          </button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:.78rem;color:var(--text-4);">
          Not an admin?
          <button onclick="switchLoginTab('student')" style="background:none;border:none;color:#7c3aed;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--font);padding:0;">Sign in as student</button>
        </p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault(); e.stopPropagation();
      const form = document.getElementById('loginForm');
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const alertBox = document.getElementById('loginAlert');
      const alertMsg = document.getElementById('loginAlertMsg');
      if (alertBox) alertBox.className = 'auth-alert';

      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-4.43"/></svg> Signing in…`;

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('unilost_user', JSON.stringify(data));
          window.location.href = data.role === 'ADMIN' ? 'admin.html' : 'index.html';
        } else {
          if (alertBox) { alertBox.className = 'auth-alert error show'; alertMsg.textContent = data.message || 'Invalid email or password.'; }
          btn.disabled = false; btn.innerHTML = orig;
        }
      } catch {
        if (alertBox) { alertBox.className = 'auth-alert error show'; alertMsg.textContent = 'Could not connect to server.'; }
        btn.disabled = false; btn.innerHTML = orig;
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault(); e.stopPropagation();
      const form = document.getElementById('adminLoginForm');
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const email    = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const btn      = document.getElementById('adminLoginBtn');
      const alertBox = document.getElementById('adminLoginAlert');
      const alertMsg = document.getElementById('adminLoginMsg');
      if (alertBox) { alertBox.className = 'auth-alert'; alertBox.classList.add('d-none'); }

      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-4.43"/></svg> Verifying…`;

      try {
        const res  = await fetch('/api/auth/admin-login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success && data.role === 'ADMIN') {
          localStorage.setItem('unilost_user', JSON.stringify(data));
          window.location.href = 'admin.html';
        } else {
          if (alertBox) { alertBox.classList.remove('d-none'); alertBox.style.display = 'flex'; alertMsg.textContent = data.message || 'Access denied.'; }
          btn.disabled = false; btn.innerHTML = orig;
        }
      } catch {
        if (alertBox) { alertBox.classList.remove('d-none'); alertBox.style.display = 'flex'; alertMsg.textContent = 'Could not connect to server.'; }
        btn.disabled = false; btn.innerHTML = orig;
      }
    }
  </script>
  <script>
    function switchLoginTab(tab) {
      const isStudent = tab === 'student';
      document.getElementById('tabStudent').classList.toggle('active', isStudent);
      document.getElementById('tabAdmin').classList.toggle('active', !isStudent);
      document.getElementById('tabStudent').setAttribute('aria-selected', isStudent);
      document.getElementById('tabAdmin').setAttribute('aria-selected', !isStudent);

      const student = document.getElementById('panelStudent');
      const admin   = document.getElementById('panelAdmin');
      student.classList.remove('active');
      admin.classList.remove('active');
      // Small delay so animation plays cleanly
      setTimeout(() => {
        (isStudent ? student : admin).classList.add('active');
      }, 20);

      // Reset alerts on tab switch
      ['loginAlert','adminLoginAlert'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = 'auth-alert';
      });
    }

    // Check URL param ?admin=1 to pre-open admin tab
    if (new URLSearchParams(location.search).get('admin') === '1') {
      switchLoginTab('admin');
    }
  </script>
</body>
</html>
