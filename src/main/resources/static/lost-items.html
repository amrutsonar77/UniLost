<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Lost Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbarPlaceholder"></div>
  <script>window.ACTIVE_NAV="lost";</script>

  <div class="page-hero hero-illustrated">
    <div class="container">
      <div class="hi-inner">
        <div class="hi-copy">
          <span class="section-label">Lost Items Registry</span>
          <h1>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Lost Items
          </h1>
          <p>Browse all reported lost items on campus. AI matching runs on every report.</p>
          <div class="hi-actions">
            <a href="report-lost.html" class="btn-uni-primary px-4 py-2">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Report Lost Item
            </a>
          </div>
        </div>
        <div class="hi-visual">
          <!-- Lost Items illustration — student searching with magnifier -->
          <svg viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;">
            <!-- bg blob -->
            <ellipse cx="190" cy="130" rx="100" ry="90" fill="rgba(124,58,237,0.07)"/>
            <!-- floating items -->
            <g opacity=".85">
              <!-- wallet -->
              <rect x="186" y="38" width="52" height="38" rx="7" fill="#D97706" transform="rotate(-8 186 38)"/>
              <rect x="186" y="38" width="52" height="14" rx="7" fill="#F59E0B" transform="rotate(-8 186 38)"/>
              <!-- keys -->
              <circle cx="234" cy="118" r="10" fill="none" stroke="#6B7280" stroke-width="3"/>
              <rect x="240" y="115" width="22" height="6" rx="3" fill="#6B7280"/>
              <rect x="255" y="113" width="4" height="4" rx="1" fill="#9CA3AF"/>
              <!-- bag -->
              <rect x="160" y="148" width="48" height="42" rx="8" fill="#2563EB"/>
              <path d="M172 148v-6a12 12 0 0 1 24 0v6" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
              <rect x="172" y="158" width="24" height="18" rx="5" fill="#3B82F6"/>
            </g>
            <!-- phone -->
            <rect x="74" y="55" width="28" height="50" rx="5" fill="#1F2937"/>
            <rect x="78" y="60" width="20" height="40" rx="3" fill="#374151"/>
            <!-- person body -->
            <ellipse cx="118" cy="200" rx="38" ry="16" fill="rgba(124,58,237,0.10)"/>
            <rect x="92" y="130" width="52" height="72" rx="26" fill="#7C3AED"/>
            <rect x="96" y="130" width="44" height="36" rx="22" fill="#8B5CF6"/>
            <!-- arms -->
            <path d="M92 155 Q68 158 60 178" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round"/>
            <path d="M144 155 Q162 160 170 175" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round"/>
            <!-- head -->
            <circle cx="118" cy="110" r="28" fill="#FBBF24"/>
            <circle cx="108" cy="106" r="4" fill="#1F2937"/>
            <circle cx="128" cy="106" r="4" fill="#1F2937"/>
            <path d="M110 120 Q118 127 126 120" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <!-- hair -->
            <path d="M90 100 Q92 80 118 78 Q144 80 146 100" fill="#1F2937"/>
            <!-- magnifier -->
            <circle cx="168" cy="152" r="22" fill="white" fill-opacity=".9" stroke="#7C3AED" stroke-width="5"/>
            <path d="M184 168 L200 184" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
            <!-- sparkles -->
            <text x="50" y="80" font-size="16" fill="#A78BFA" opacity=".7">✦</text>
            <text x="220" y="58" font-size="12" fill="#60A5FA" opacity=".8">✦</text>
            <text x="248" y="155" font-size="10" fill="#FBBF24" opacity=".7">✦</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="container page-wrapper" style="padding-top:28px;">
    <div class="filter-bar">
      <div class="row g-3 align-items-end">
        <div class="col-lg-4 col-12">
          <label class="form-label">Search</label>
          <div class="search-bar">
            <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Item name, keyword…" onkeydown="if(event.key==='Enter')searchLostItems()">
          </div>
        </div>
        <div class="col-lg-2 col-6"><label class="form-label">Category</label><select id="categoryFilter" class="form-select"></select></div>
        <div class="col-lg-2 col-6">
          <label class="form-label">Status</label>
          <select id="statusFilter" class="form-select">
            <option value="">All Statuses</option>
            <option value="PENDING">Pending</option><option value="MATCHED">Matched</option><option value="RECOVERED">Recovered</option>
          </select>
        </div>
        <div class="col-lg-2 col-6"><label class="form-label">Color</label><input type="text" id="colorFilter" class="form-control" placeholder="e.g. Black"></div>
        <div class="col-lg-2 col-6"><label class="form-label">Location</label><input type="text" id="locationFilter" class="form-control" placeholder="e.g. Library"></div>
      </div>
      <div class="d-flex gap-2 mt-3 align-items-center flex-wrap">
        <button class="btn-uni-primary btn btn-sm px-4" onclick="searchLostItems()">Search</button>
        <button onclick="resetLostFilters()" class="btn-ghost btn btn-sm px-4">Reset</button>
        <span id="resultsInfo" style="font-size:.8rem;color:var(--text-4);margin-left:auto;"></span>
      </div>
    </div>
    <div id="lostItemsContainer" class="row g-4"></div>
  </div>

  <footer>UniLost &copy; 2026 &nbsp;·&nbsp; Campus Lost &amp; Found</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script><script src="js/lost-list.js"></script>
</body></html>
