<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .profile-hero { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--r-2xl); padding:32px 28px; margin-bottom:22px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; position:relative; overflow:hidden; }
    .profile-hero::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(135deg,#a78bfa,#38bdf8,#fbbf24); pointer-events:none; }
    .stat-sm { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px 14px; text-align:center; transition:all .25s; }
    .stat-sm:hover { border-color:var(--border-2); box-shadow:var(--shadow-md); transform:translateY(-2px); }
    .stat-sm .num { font-size:1.7rem; font-weight:900; color:#111439; letter-spacing:-1px; line-height:1; }
    .stat-sm .lbl { font-size:.68rem; font-weight:700; color:var(--text-4); text-transform:uppercase; letter-spacing:.7px; margin-top:6px; }
    .form-section { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--r-xl); padding:28px 26px; }
  </style>
</head>
<body>
  <div id="navbarPlaceholder"></div>
  <script>window.ACTIVE_NAV="profile";</script>

  <div class="page-hero hero-illustrated">
    <div class="container">
      <div class="hi-inner">
        <div class="hi-copy">
          <span class="section-label">Account</span>
          <h1>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            My Profile
          </h1>
          <p>Manage your account details and keep your information up to date.</p>
        </div>
        <div class="hi-visual">
          <!-- Profile illustration — person with profile card & security badge -->
          <svg viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;">
            <!-- bg blob -->
            <ellipse cx="180" cy="120" rx="105" ry="90" fill="rgba(124,58,237,0.07)"/>
            <!-- profile card -->
            <rect x="130" y="50" width="128" height="148" rx="14" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
            <rect x="130" y="50" width="128" height="48" rx="14" fill="#EDE9FE"/>
            <rect x="130" y="80" width="128" height="18" rx="0" fill="#EDE9FE"/>
            <!-- avatar on card -->
            <circle cx="194" cy="78" r="26" fill="#7C3AED"/>
            <circle cx="194" cy="70" r="11" fill="#C4B5FD"/>
            <path d="M172 100 Q174 88 194 88 Q214 88 216 100" fill="#C4B5FD"/>
            <!-- card text lines -->
            <text x="148" y="118" font-size="10" fill="#1F2937" font-family="Inter,sans-serif" font-weight="700">Your details</text>
            <rect x="148" y="124" width="80" height="5" rx="2.5" fill="#E5E7EB"/>
            <rect x="148" y="133" width="60" height="5" rx="2.5" fill="#E5E7EB"/>
            <text x="148" y="155" font-size="10" fill="#1F2937" font-family="Inter,sans-serif" font-weight="700">Your security</text>
            <rect x="148" y="161" width="70" height="5" rx="2.5" fill="#E5E7EB"/>
            <rect x="148" y="170" width="50" height="5" rx="2.5" fill="#E5E7EB"/>
            <!-- security shield badge -->
            <path d="M218 180 Q218 196 228 200 Q238 196 238 180 L228 176 Z" fill="#7C3AED"/>
            <polyline points="222,189 227,194 234,184" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- person -->
            <ellipse cx="78" cy="210" rx="36" ry="13" fill="rgba(124,58,237,0.10)"/>
            <rect x="56" y="140" width="44" height="65" rx="22" fill="#7C3AED"/>
            <rect x="60" y="140" width="36" height="30" rx="18" fill="#8B5CF6"/>
            <path d="M56 163 Q34 170 30 188" stroke="#8B5CF6" stroke-width="17" stroke-linecap="round"/>
            <path d="M100 163 Q118 168 122 182" stroke="#8B5CF6" stroke-width="17" stroke-linecap="round"/>
            <circle cx="78" cy="116" r="27" fill="#FBBF24"/>
            <circle cx="70" cy="112" r="4" fill="#1F2937"/>
            <circle cx="86" cy="112" r="4" fill="#1F2937"/>
            <path d="M71 127 Q78 134 85 127" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M51 108 Q53 88 78 86 Q103 88 105 108" fill="#374151"/>
            <!-- sparkles -->
            <text x="40" y="78" font-size="14" fill="#A78BFA" opacity=".7">✦</text>
            <text x="255" y="75" font-size="12" fill="#60A5FA" opacity=".8">✦</text>
            <text x="248" y="168" font-size="10" fill="#FBBF24" opacity=".6">✦</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="container page-wrapper" style="max-width:700px;padding-top:28px;">

    <!-- Header card -->
    <div class="profile-hero">
      <div class="profile-avatar" id="profileAvatar" style="position:relative;z-index:1;font-size:1.5rem;">?</div>
      <div style="position:relative;z-index:1;">
        <h2 style="font-size:1.25rem;font-weight:900;letter-spacing:-.4px;margin-bottom:3px;color:var(--text);" id="profileHeaderName">Loading…</h2>
        <div style="font-size:.82rem;color:var(--text-3);display:flex;align-items:center;gap:5px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <span id="profileHeaderEmail"></span>
        </div>
        <div style="display:inline-block;margin-top:8px;background:rgba(17,20,57,.07);border:1px solid rgba(17,20,57,.15);color:#111439;font-size:.65rem;font-weight:700;padding:2px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px;" id="profileHeaderRole"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-4">
        <div class="stat-sm">
          <div class="num" id="statLostReports">—</div>
          <div class="lbl" style="display:flex;align-items:center;justify-content:center;gap:4px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
            Lost Reports
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-sm">
          <div class="num" id="statFoundReports">—</div>
          <div class="lbl" style="display:flex;align-items:center;justify-content:center;gap:4px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            Found Reports
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-sm">
          <div class="num" id="statRecoveredItems">—</div>
          <div class="lbl" style="display:flex;align-items:center;justify-content:center;gap:4px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Recovered
          </div>
        </div>
      </div>
    </div>

    <!-- Edit form -->
    <div class="form-section">
      <span class="section-label">Edit Profile</span>
      <div id="profileAlert" class="d-none mb-4" style="border-radius:var(--r-sm);padding:11px 14px;font-size:.85rem;display:flex;align-items:center;gap:8px;"></div>
      <form id="profileForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Full Name <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" id="fullName" required maxlength="100">
          <div class="invalid-feedback">Required.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" disabled style="opacity:.45;">
          <div style="font-size:.72rem;color:var(--text-4);margin-top:4px;display:flex;align-items:center;gap:4px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            Email cannot be changed.
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">University / College</label>
          <input type="text" class="form-control" id="collegeName" placeholder="e.g. ABC Institute of Technology" maxlength="150">
        </div>
        <button type="submit" class="btn-uni-primary btn px-5 py-2" id="saveProfileBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Save Changes
        </button>
      </form>
    </div>

    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
      <a href="my-reports.html" class="btn-ghost btn btn-sm px-4">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        My Reports
      </a>
      <a href="messages.html" class="btn-ghost btn btn-sm px-4">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </a>
    </div>

  </div>
  <footer>UniLost &copy; 2026 &nbsp;·&nbsp; Campus Lost &amp; Found</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script><script src="js/profile.js"></script>
</body></html>
