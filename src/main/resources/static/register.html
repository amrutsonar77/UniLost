<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLost — Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Animated blobs -->
  <div class="auth-blob auth-blob-1" aria-hidden="true"></div>
  <div class="auth-blob auth-blob-2" aria-hidden="true"></div>
  <div class="auth-blob auth-blob-3" aria-hidden="true"></div>

  <div class="auth-wrap">
    <div class="auth-card" role="main">

      <!-- Logo + heading -->
      <div style="text-align:center;margin-bottom:28px;">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:18px;">
          <span class="brand-mark">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
              <circle cx="8.5" cy="8.5" r="5.5" stroke="#fff" stroke-width="2"/>
              <circle cx="8.5" cy="7.5" r="1.6" fill="#fff"/>
              <path d="M8.5 9.1C7.2 10.8 8.5 12.5 8.5 12.5C8.5 12.5 9.8 10.8 8.5 9.1Z" fill="#fff"/>
              <line x1="13" y1="13" x2="18.5" y2="18.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span style="font-weight:800;font-size:1rem;color:var(--text);">UniLost</span>
        </a>
        <h1 style="font-size:1.45rem;font-weight:900;letter-spacing:-.5px;margin:0 0 5px;color:var(--text);">Create your account</h1>
        <p style="color:var(--text-3);font-size:.85rem;margin:0;">Join your campus lost &amp; found community</p>
      </div>

      <!-- Alert box -->
      <div class="auth-alert" id="regAlert" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span id="regAlertMsg"></span>
      </div>

      <!-- Registration form — single step, no OTP -->
      <form id="regForm" novalidate autocomplete="off" onsubmit="handleRegister(event)">

        <div class="mb-3">
          <label class="form-label" for="fullName">Full Name <span style="color:var(--danger)">*</span></label>
          <div class="input-icon-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" class="form-control" id="fullName" name="fullName"
                   required minlength="2" maxlength="100"
                   placeholder="Rahul Sharma" autocomplete="name">
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="regEmail">Email address <span style="color:var(--danger)">*</span></label>
          <div class="input-icon-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" class="form-control" id="regEmail" name="email"
                   required placeholder="you@example.com" autocomplete="email">
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="collegeName">University / College <span style="color:var(--text-4);font-weight:400;">(optional)</span></label>
          <div class="input-icon-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            <input type="text" class="form-control" id="collegeName" name="collegeName"
                   placeholder="e.g. ABC Institute of Technology" maxlength="150" autocomplete="organization">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="regPassword">Password <span style="color:var(--danger)">*</span></label>
          <div class="input-icon-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" class="form-control" id="regPassword" name="password"
                   required minlength="6" maxlength="128"
                   placeholder="Min. 6 characters" autocomplete="new-password"
                   style="padding-right:42px !important;">
            <button type="button" class="toggle-pwd" onclick="togglePwd('regPassword',this)" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="pwdStrengthFill"></div></div>
          <div class="pwd-strength-label" id="pwdStrengthLabel" style="color:var(--text-4);"></div>
        </div>

        <button type="submit" class="btn-auth" id="registerBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Create Account
        </button>
      </form>

      <!-- Footer link -->
      <p style="text-align:center;margin-top:20px;font-size:.83rem;color:var(--text-3);">
        Already have an account?
        <a href="login.html" style="color:#7c3aed;font-weight:600;">Sign in</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Inline handler — guaranteed to run even if auth.js has a parse issue
    async function handleRegister(e) {
      e.preventDefault();
      e.stopPropagation();

      const form = document.getElementById('regForm');
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const fullName    = document.getElementById('fullName').value.trim();
      const email       = document.getElementById('regEmail').value.trim();
      const password    = document.getElementById('regPassword').value;
      const collegeName = (document.getElementById('collegeName')?.value || '').trim();
      const btn         = document.getElementById('registerBtn');

      const alertBox = document.getElementById('regAlert');
      const alertMsg = document.getElementById('regAlertMsg');
      if (alertBox) alertBox.className = 'auth-alert';

      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-4.43"/></svg> Creating…`;

      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password, collegeName })
        });
        const data = await res.json();

        if (data.success) {
          if (alertBox) { alertBox.className = 'auth-alert success show'; alertMsg.textContent = '✓ Account created! Redirecting…'; }
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          if (alertBox) { alertBox.className = 'auth-alert error show'; alertMsg.textContent = data.message || 'Could not create account.'; }
          btn.disabled = false;
          btn.innerHTML = orig;
        }
      } catch(err) {
        if (alertBox) { alertBox.className = 'auth-alert error show'; alertMsg.textContent = 'Could not connect to server.'; }
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }
  </script>
</body>
</html>
